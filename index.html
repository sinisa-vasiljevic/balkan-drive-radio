<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Balkan Drive Radio V5.1</title>
<style>
:root{--bg:#070a10;--panel:#111824;--panel2:#172231;--line:#2b394d;--text:#f7f9fc;--muted:#91a0b3;--cyan:#2dc8ff;--green:#5af095;--player:166px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;overscroll-behavior:none}button,input{font:inherit}button{touch-action:manipulation}
.app{max-width:560px;min-height:100vh;margin:auto;padding-bottom:calc(var(--player) + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0c111a,#070a10 44%)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#080c13f2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;background:url('icon-192.png') center/cover no-repeat;box-shadow:0 0 20px #ff202055}.logo:after{content:none}
.brand{min-width:0}.brand b{display:block;font-size:19px;line-height:1.05}.brand small{display:block;margin-top:4px;color:#91a4bb;font-size:12px;font-weight:800}.live-pill{margin-left:auto;border:1px solid #2b7650;background:#123822;color:#79ffad;padding:7px 9px;border-radius:99px;font-size:11px;font-weight:900}
.controls{padding:11px 12px 8px;display:grid;grid-template-columns:1fr auto;gap:9px}.search{height:48px;border:1px solid var(--line);border-radius:15px;background:#111823;color:white;padding:0 15px;font-size:17px;outline:none}.count{min-width:68px;border:1px solid var(--line);border-radius:15px;background:var(--panel);display:grid;place-items:center;color:#9fb0c4;font-size:12px;font-weight:900}
.list{padding:0 11px}.station{width:100%;min-height:84px;margin-bottom:9px;padding:9px 10px;display:grid;grid-template-columns:54px 1fr 46px;gap:12px;align-items:center;text-align:left;color:white;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#17202d,#0f151e);box-shadow:0 8px 22px #0004}.station:active{transform:scale(.985)}.station.playing{border-color:var(--cyan);box-shadow:0 0 0 2px #28c8ff22,0 8px 22px #0005}
.station-logo{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,#27c8ff,#57e990);color:#071019;font-size:15px;font-weight:1000}.station:nth-child(even) .station-logo{background:linear-gradient(140deg,#ffdb58,#ff7957)}.station:nth-child(3n) .station-logo{background:linear-gradient(140deg,#c96cff,#ff69a6)}
.station-copy{min-width:0}.station-copy b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.station-copy small{display:block;color:var(--green);font-size:13px;font-weight:850;margin-top:5px}.station-action{width:44px;height:44px;border:2px solid #eef6ff;border-radius:50%;display:grid;place-items:center;font-weight:900}.playing .station-action{background:var(--cyan);border-color:var(--cyan);color:#061019}
.empty{padding:35px 20px;text-align:center;color:var(--muted)}
.player{position:fixed;z-index:40;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);min-height:var(--player);padding:17px 18px calc(16px + env(safe-area-inset-bottom));background:#0d141ef8;backdrop-filter:blur(18px);border-top:1px solid #3a485e;box-shadow:0 -12px 30px #0008}
.player-grid{display:grid;grid-template-columns:1fr 68px;gap:14px;align-items:center}.player-text{min-width:0}.player-text>strong{display:block;font-size:23px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:17px;font-weight:850;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title{font-size:15px;color:#bec9d6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{display:block;margin-top:10px;color:var(--green);font-size:13px;font-weight:900}.play-main{width:68px;height:68px;border:0;border-radius:50%;background:#fff;color:#071019;font-size:27px;font-weight:900}
.notice{padding:0 13px 14px;color:#728296;font-size:11px;line-height:1.35}.hidden{display:none!important}
</style>
</head>
<body>
<audio id="audio" preload="none" playsinline></audio>

 <div class="player-grid">
  <div class="player-text"><strong id="nowName">Noch kein Sender</strong><div id="artist" class="artist"></div><div id="trackTitle" class="title">Sender auswählen</div><small id="state" class="state">BEREIT</small></div>
  <button id="mainPlay" class="play-main">▶</button>
 </div>

<script>
(function(){
'use strict';
const catalogue=[{"id": "sehara", "name": "Radio Sehara", "stream": "https://sehara.name.ba/;"}, {"id": "cool", "name": "Cool Radio", "stream": "https://live.coolradio.rs/cool128"}, {"id": "ok", "name": "OK Radio", "stream": "https://sslstream.okradio.net/;?type=http"}, {"id": "extra", "name": "Extra Radio", "stream": "https://uzivo.extraradio.ba/stream"}, {"id": "jackfolk", "name": "Jack Folk Radio", "stream": "https://media.radioexs.com/stream/jackfolkradio"}, {"id": "balkanmusic", "name": "Radio Balkan Music", "stream": "https://media.radioexs.com/stream/radiobalkanmusic"}, {"id": "zivoteka", "name": "Radio Zivoteka", "stream": "https://media.radioexs.com/stream/zivoteka"}, {"id": "izvorni", "name": "Izvorni Radio EXS", "stream": "https://media.radioexs.com/stream/izvorniradioexs"}, {"id": "dzungla", "name": "Radio Dzungla", "stream": "https://cast2.name.ba/proxy/dzungla/stream"}, {"id": "dijaspora", "name": "Radio Dijaspora", "stream": "https://stream.radiodijaspora.com/radio/8010/radio.mp3"}, {"id": "stil", "name": "Stil Radio", "stream": "https://a2.asurahosting.com/listen/stil_radio/stilradio"}, {"id": "narodna", "name": "Radio Balkan Narodna", "stream": "https://radiobalkan.live/radio/live/narodna.mp3"}, {"id": "spark", "name": "Spark Radio", "stream": "https://usa21.fastcast4u.com/sparkradio"}, {"id": "svidakov", "name": "Svi Dakov", "stream": "https://eu4.fastcast4u.com/proxy/svidakov?mp=/1"}, {"id": "studiom2", "name": "Studio M2", "stream": "https://stream.leftor.com/proxy/studiom2/stream"}, {"id": "bigbalkan", "name": "Big Balkan", "stream": "https://audiotainment-sw.streamabc.net/atsw-bigbalkan-mp3-128-8067682?sABC=6no7190s%230%239np452r18352qp40q654np68123o4r4o%23gjy&aw_0_1st.playerid=twl&amsparams=playerid:twl;skey:1790384399"}];
const audio=document.getElementById('audio');
const buttons=[...document.querySelectorAll('.station')];
const byId=Object.fromEntries(buttons.map(b=>[b.dataset.id,b]));
let current=null,playing=false,requestNumber=0;
const $=id=>document.getElementById(id);
function text(id,value){$(id).textContent=value}
function fallback(state='LIVE · Radio läuft'){text('artist','');text('trackTitle','');text('state',state)}
function setTrack(raw){
 raw=(raw||'').replace(/<[^>]*>/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
 if(!raw||raw.length>220||/doctype|html/i.test(raw)){fallback();return}
 let p=raw.split(/\s+-\s+/);text('artist',p.length>1?p.shift():'');text('trackTitle',p.length?p.join(' - '):raw);text('state','LIVE · Radio läuft');
 if('mediaSession' in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({artist:$('artist').textContent,title:$('trackTitle').textContent||current.dataset.name,album:current.dataset.name,artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}catch(e){}
}
async function metadata(){
 if(!current||!playing)return;
 const id=current.dataset.id;
 const endpoints=id==='sehara'?['https://sehara.name.ba/currentsong?sid=1']:id==='ok'?['https://sslstream.okradio.net/currentsong?sid=1']:[];
 for(const url of endpoints){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){const v=(await r.text()).trim();if(v){setTrack(v);return}}}catch(e){}}
 fallback();
}
function update(){buttons.forEach(b=>{const on=b===current&&playing;b.classList.toggle('playing',on);b.querySelector('.station-action').textContent=on?'Ⅱ':'▶'});text('nowName',current?current.dataset.name:'Noch kein Sender');text('mainPlay',playing?'Ⅱ':'▶')}
function fail(){playing=false;update();text('artist','');text('trackTitle','Stream konnte nicht gestartet werden');text('state','FEHLER')}
function choose(btn){
 if(current===btn){audio.paused?audio.play().catch(fail):audio.pause();return}
 current=btn;requestNumber++;text('nowName',btn.dataset.name);text('artist','');text('trackTitle','Stream wird geladen …');text('state','VERBINDUNG');audio.src=btn.dataset.stream;audio.play().catch(fail);update();
}
buttons.forEach(b=>b.addEventListener('click',()=>choose(b)));
audio.addEventListener('playing',()=>{playing=true;update();fallback();metadata()});audio.addEventListener('pause',()=>{playing=false;update();if(current)text('state','PAUSIERT')});audio.addEventListener('waiting',()=>{text('trackTitle','Stream wird geladen …');text('state','VERBINDUNG')});audio.addEventListener('error',fail);
$('mainPlay').onclick=()=>{if(!current)choose(buttons[0]);else audio.paused?audio.play().catch(fail):audio.pause()};
$('search').oninput=function(){const q=this.value.trim().toLowerCase();let n=0;buttons.forEach(b=>{const show=b.dataset.name.toLowerCase().includes(q);b.classList.toggle('hidden',!show);if(show)n++});text('count',n)};
if('mediaSession' in navigator)try{navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause())}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
update();
})();
</script>
</body></html>
